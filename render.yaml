services:
  - type: web
    name: prephire-ml
    runtime: python
    rootDir: .
    buildCommand: pip install setuptools && pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 120 app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: TF_CPP_MIN_LOG_LEVEL
        value: "3"
    plan: starter
